; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0

; --- Flash via WiFi (OTA) ---
; Utilisation : pio run -e ota --target upload
[env:ota]
platform   = ${env:esp32-c6-devkitc-1.platform}
board      = esp32-c6-devkitc-1
framework  = arduino
build_flags = ${env:esp32-c6-devkitc-1.build_flags}
lib_deps   = ${env:esp32-c6-devkitc-1.lib_deps}
upload_protocol = espota
;upload_port    = chesslab.local   ; mDNS — souvent bloqué par les routeurs
upload_port     = 192.168.1.109     ; ← remplacer par l'IP affichée dans le moniteur série
upload_flags    = --auth=chesslab2025
